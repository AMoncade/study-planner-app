[project]
name = "plan-etudes"
version = "0.1.0"
description = "Planificateur d'etudes universitaire local (PySide6)"
requires-python = ">=3.12,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
